[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-python"
version = "2.1.0"
description = "Python SDK for the LiteArm robotic arm"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "NEXFORM ROBOTICS" }]
keywords = ["litearm", "robotic-arm", "robot-arm", "robotics", "serial", "stm32", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/nexform-tech/litearm-python"
Issues = "https://github.com/nexform-tech/litearm-python/issues"
Documentation = "https://github.com/nexform-tech/litearm-python/blob/main/docs/DEVELOPER_GUIDE.md"

[project.scripts]
litearm-python = "litearm.arm:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litearm = ["py.typed"]
