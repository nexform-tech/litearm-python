[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-python"
version = "2.1.0"
description = "Python SDK for the LiteArm robotic arm"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
litearm-python = "litearm.arm:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litearm = ["py.typed"]
