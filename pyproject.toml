[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litearm-python"
version = "0.1.0"
description = "LiteArm 机械臂 Python 客户端 SDK（远程调用 litearm-server）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "luochun" }]
keywords = ["robotics", "robot-arm", "litearm", "zenoh"]
dependencies = [
    "eclipse-zenoh>=1.0,<1.8",
    "protobuf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
