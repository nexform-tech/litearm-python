name: Feature request
description: Propose a change in English.
title: ""
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English. Describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else did you consider?
    validations:
      required: true
